services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: release_guardian
      POSTGRES_PASSWORD: release_guardian
      POSTGRES_DB: release_guardian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF keeps Celery tasks and locks across restarts.  noeviction prevents
    # Redis from silently dropping broker messages or rate-limit state.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://release_guardian:release_guardian@postgres:5432/release_guardian
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    pids_limit: 512
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://release_guardian:release_guardian@postgres:5432/release_guardian
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Let Celery finish in-flight tasks after SIGTERM (acks_late is enabled).
    stop_grace_period: 35s
    init: true
    pids_limit: 512
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=512m
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info

  browser-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://release_guardian:release_guardian@postgres:5432/release_guardian
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Browser journeys can exceed a Celery time limit; acks_late re-dispatches.
    stop_grace_period: 60s
    init: true
    pids_limit: 1024
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=1g
    command: >
      celery -A app.workers.celery_app.celery_app worker
      -Q browser,lighthouse --concurrency=2 --loglevel=info

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://release_guardian:release_guardian@postgres:5432/release_guardian
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info

volumes:
  pgdata:
  redisdata:
