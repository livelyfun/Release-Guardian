name: Bug report
description: Report a reproducible defect in Release Guardian.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the repository's
        **Security** tab and choose **Report a vulnerability** — see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the defect and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project and monitor with ...
        2. Trigger a run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API
        - Dashboard
        - Worker (Celery)
        - Browser worker (Playwright)
        - Scheduler
        - Migrations
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run it (Docker Compose, managed platform, local), OS, Python/Node versions.
      placeholder: Docker Compose on Ubuntu 24.04, Python 3.12, Node 20
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or evidence
      description: Redact secrets, tokens, and personal data before pasting.
      render: shell
